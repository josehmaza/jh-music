plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jh.caraudio'
    compileSdk 33

    defaultConfig {
        applicationId "com.jh.caraudio"
        minSdk 21
        targetSdk 28
        versionCode 5
        versionName "1.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
