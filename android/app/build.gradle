plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jh.caraudio'
    compileSdk 33

    defaultConfig {
        applicationId "com.jh.caraudio"
        minSdk 21
        targetSdk 28
        versionCode 43
        versionName "2.11.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Misma clave que debug: se instala sobre la versión anterior sin desinstalar
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    lint {
        // Exigencia de Google Play; no aplica a una app instalada a mano en el radio
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Nombre del APK con la versión: JH-MUSIC-v1.9.8.apk
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "JH-MUSIC-v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
}

// Al terminar assembleRelease, copia el APK a la carpeta jh-music/ (al lado del simulador web)
// reemplazando el de la versión anterior (el historial de git conserva los viejos)
tasks.register('copyApkToRoot') {
    doLast {
        def repoRoot = rootProject.projectDir.parentFile
        project.delete(fileTree(repoRoot) { include 'JH-MUSIC-v*.apk', 'JH-CarAudio.apk' })
        project.copy {
            from layout.buildDirectory.dir('outputs/apk/release')
            include '*.apk'
            into repoRoot
        }
    }
}

afterEvaluate {
    tasks.named('assembleRelease').configure { finalizedBy 'copyApkToRoot' }
}
